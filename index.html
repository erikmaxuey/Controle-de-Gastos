<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus gastos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f1;--card:#fff;--text:#12263a;--muted:#62707e;--line:#dde4e3;--ok:#0e7c66;--bad:#c2410c;--chip:#e8eeed;--btn:#12263a;--btnt:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a24;--card:#17252f;--text:#e8eef0;--muted:#93a3ad;--line:#25363f;--ok:#3ec9a7;--bad:#ff8a5c;--chip:#223440;--btn:#e8eef0;--btnt:#0f1a24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a24;--card:#17252f;--text:#e8eef0;--muted:#93a3ad;--line:#25363f;--ok:#3ec9a7;--bad:#ff8a5c;--chip:#223440;--btn:#e8eef0;--btnt:#0f1a24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;line-height:1.4}
.app{max-width:560px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:22px;margin:0;font-weight:800}
h2{font-size:16px;margin:0;font-weight:800}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:13px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:22px}
#ml{font-size:18px;font-weight:600}
.seg{display:flex;gap:4px;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:14px}.seg button{flex:1;border:0;background:none;color:var(--muted);border-radius:9px;padding:10px 6px;font-weight:600;min-height:44px}.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hero{background:var(--card);border-radius:20px;padding:22px 20px;margin-bottom:14px;border:1px solid var(--line)}
.hero .big{font-size:44px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.hero .sub{color:var(--muted);font-size:14px;margin-top:4px}
.row2{display:flex;gap:24px;margin-top:16px;font-size:14px;color:var(--muted)}
.row2 b{display:block;color:var(--text);font-size:17px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.card{background:var(--card);border-radius:14px;border:1px solid var(--line);margin-bottom:14px;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);gap:10px}
.inc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.inc input{width:92px;font:inherit;font-size:15px;font-weight:600;text-align:right;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--text)}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;color:var(--text);text-align:left;min-height:48px}
.it:last-of-type{border-bottom:0}
.nm{flex:1;min-width:0}
.nm small{display:block;color:var(--muted);font-size:12px}
.v{font-weight:600;white-space:nowrap}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--muted);margin-left:6px}
.ft{display:flex;justify-content:space-between;padding:12px 16px;font-weight:600;border-top:1px solid var(--line);background:var(--bg)}
.sh{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);font-size:14px;font-weight:800}.sh span{margin-left:auto;color:var(--muted);font-weight:600}.sh .ghost{padding:6px 10px;font-size:13px;font-weight:600;color:var(--text)}
.empty{padding:16px;color:var(--muted);font-size:14px}
#bars{display:flex;gap:6px;align-items:stretch;padding:14px 12px 12px;overflow-x:auto}
.b{flex:1;min-width:36px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;background:none;border:0;color:var(--muted);font-size:11px;padding:0}
.b i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--ok)}
.b.n i{background:var(--bad)}
.b.cur{color:var(--text);font-weight:800}
.bw{height:72px;width:100%;display:flex;align-items:flex-end}
.bk{display:flex;gap:8px;justify-content:center}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btnt);border:0;border-radius:999px;padding:14px 26px;font-weight:800;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.note{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
dialog{border:0;border-radius:18px;padding:0;width:min(440px,92vw);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dg{padding:20px;display:grid;gap:12px}
.dg label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.dg input,.dg select{font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
.dg label.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text)}.dg .chk input{width:22px;height:22px;padding:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.acts button{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--text);font-weight:600}
.acts .pri{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.acts .del{color:var(--bad);margin-right:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12263a">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meus gastos">
</head>
<body>
<div class="app">
  <header><h1>Meus gastos</h1><button class="ghost" id="rst">Restaurar exemplo</button></header>
  <div class="nav"><button id="pv" aria-label="Mês anterior">‹</button><div id="ml"></div><button id="nx" aria-label="Próximo mês">›</button></div>
  <div class="seg" id="seg"><button data-v="all">Tudo</button><button data-v="15">Dia 15</button><button data-v="30">Final do mês</button></div>
  <div class="hero" id="hero"></div>
  <div id="cy"></div>
  <div class="card"><div class="ch"><h2>Sobra nos próximos meses</h2></div><div id="bars"></div></div>
  <div class="bk"><button class="ghost" id="bx">Salvar backup</button><button class="ghost" id="bi">Restaurar backup</button><input type="file" id="bf" accept="application/json,.json" hidden></div>
  <p class="note">Os dados ficam salvos só neste aparelho. Salve um backup de vez em quando.</p>
</div>
<button class="fab" id="add">+ Novo gasto</button>

<dialog id="dlg">
  <div class="dg">
    <h2 id="dt">Novo gasto</h2>
    <label>Nome<input id="fn" type="text" placeholder="Ex.: Academia"></label>
    <div class="g2">
      <label>Valor (R$)<input id="fv" type="number" step="0.01" inputmode="decimal"></label>
      <label>Tipo<select id="ft"><option value="Fixa">Conta fixa</option><option value="Variável">Conta variável (cartão)</option></select></label>
    </div>
    <div class="g2">
      <label>Pago com<select id="fc"><option value="15">Dia 15</option><option value="30">Final do mês</option></select></label>
      <label>Começa em<input id="fs" type="month"></label>
    </div>
    <label class="chk"><input id="fr" type="checkbox"> Recorrente (todo mês, sem data para acabar)</label>
    <div class="g2">
      <label id="fkl">Quantas vezes<input id="fk" type="number" min="1" step="1" inputmode="numeric"></label>
      <label>A cada (meses)<input id="fe" type="number" min="1" step="1" inputmode="numeric"></label>
    </div>
    <div class="acts"><button type="button" class="del" id="fd">Excluir</button><button type="button" id="fx">Cancelar</button><button type="button" class="pri" id="fsv">Salvar</button></div>
  </div>
</dialog>

<script>
const MN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ix=(y,m)=>y*12+m-1;
const lab=i=>MN[i%12]+'/'+Math.floor(i/12);
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

function seed(){
  const L=[];let n=0;
  const a=(name,v,c,s,k,t,e)=>L.push({id:'s'+(n++),name,v,c,s,k,t:t==='Cartão'?'Variável':'Fixa',e:e||1});
  const N=ix(2026,11),D=ix(2026,12),J=ix(2027,1);
  a('Credicard',75.71,'15',N,1,'Cartão');
  a('Financiamento (nov)',710.30,'15',N,1,'Conta fixa');
  a('Financiamento',705.43,'15',D,0,'Conta fixa');
  a('Plano TV',30,'15',N,0,'Conta fixa');
  a('Apartamento',637,'15',N,0,'Conta fixa');
  a('Plano internet',29.99,'30',D,0,'Cartão');
  a('Spotify',23.90,'30',D,0,'Cartão');
  a('Academia',91.70,'30',D,0,'Cartão');
  a('Aquecedor',87.98,'30',D,2,'Cartão');
  a('Cama',79.90,'30',D,2,'Cartão');
  a('Sofá',165,'30',D,2,'Cartão');
  a('Mão de obra aquecedor',37.53,'30',D,2,'Cartão');
  a('Parcelamento do cartão',154,'30',D,4,'Cartão');
  a('Box banheiro',40,'30',D,7,'Cartão');
  a('Box banheiro (2)',23,'30',D,7,'Cartão');
  a('Air fryer',25.64,'30',D,7,'Cartão');
  a('Churrasqueira',26.99,'30',D,7,'Cartão');
  a('Compras online',37.24,'30',D,7,'Cartão');
  a('Boné',20.99,'30',D,9,'Cartão');
  a('Luz',100,'30',J,0,'Conta fixa',2);
  a('Água e gás',80,'30',D,0,'Conta fixa');
  a('Internet',95,'30',D,0,'Conta fixa');
  a('Condomínio (dez)',350,'30',D,1,'Conta fixa');
  a('Condomínio',300,'30',J,0,'Conta fixa');
  a('Imposto de renda',52,'30',D,2,'Outro');
  return {inc:{'15':1590,'30':1874},items:L};
}
function load(){try{const r=localStorage.getItem('cg1');if(r){const o=JSON.parse(r);o.items.forEach(e=>{e.t=(e.t==='Cartão'||e.t==='Variável')?'Variável':'Fixa'});return o}}catch(e){}return seed()}
function save(){try{localStorage.setItem('cg1',JSON.stringify(S))}catch(e){}}
let S=load();
const now=new Date();
let M=ix(now.getFullYear(),now.getMonth()+1);
let V='all';

function occ(e,m){const d=m-e.s;if(d<0||d%e.e)return null;const j=d/e.e;if(e.k&&j>=e.k)return null;return j}
function calc(m,c){const l=S.items.filter(e=>e.c===c&&occ(e,m)!==null).sort((a,b)=>b.v-a.v);const t=l.reduce((s,e)=>s+e.v,0);return{l,t,d:(+S.inc[c]||0)-t}}
function sobra(m){return (V==='all'||V==='15'?calc(m,'15').d:0)+(V==='all'||V==='30'?calc(m,'30').d:0)}

function row(e){
  const j=occ(e,M);
  const p=e.k?' <span class="chip">'+(j+1)+'/'+e.k+'</span>':'';
  const ev=(!e.k?'recorrente':'')+(e.e>1?(!e.k?', ':'')+'a cada '+e.e+' meses':'');
  return '<button class="it" data-id="'+e.id+'"><span class="nm">'+esc(e.name)+p+(ev?'<small>'+ev+'</small>':'')+'</span><span class="v">'+brl(e.v)+'</span></button>';
}
function sec(c,t,title,l){
  const x=l.filter(e=>e.t===t),s=x.reduce((a,e)=>a+e.v,0);
  return '<div class="sh">'+title+'<span>'+brl(s)+'</span><button class="ghost" data-add="'+c+'|'+t+'">+ Adicionar</button></div>'+(x.length?x.map(row).join(''):'<div class="empty">Nada neste mês.</div>');
}
function render(){
  $('ml').textContent=lab(M);
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x.dataset.v===V));
  const a=calc(M,'15'),b=calc(M,'30'),sh=c=>V==='all'||V===c,inc=(sh('15')?+S.inc['15']||0:0)+(sh('30')?+S.inc['30']||0:0),g=(sh('15')?a.t:0)+(sh('30')?b.t:0),sb=inc-g;
  $('hero').innerHTML='<div class="sub">Sobra em '+lab(M)+(V==='15'?' (Dia 15)':V==='30'?' (final do mês)':'')+'</div><div class="big '+(sb<0?'bad':'ok')+'">'+brl(sb)+'</div>'+
    '<div class="row2"><div>Entra<b>'+brl(inc)+'</b></div><div>Sai<b>'+brl(g)+'</b></div></div>';
  let h='';
  [['15','Dia 15',a],['30','Final do mês',b]].filter(x=>sh(x[0])).forEach(([c,t,x])=>{
    h+='<div class="card"><div class="ch"><h2>'+t+'</h2><label class="inc">Recebe <input type="number" step="0.01" inputmode="decimal" data-inc="'+c+'" value="'+(S.inc[c]||0)+'"></label></div>';
    const f=S.items.filter(e=>e.c===c).map(e=>e.s);
    if(f.length&&M<Math.min(...f))h+='<div class="empty">Os gastos deste pagamento começam em '+lab(Math.min(...f))+'. Use ‹ › para mudar de mês.</div>';
    h+=sec(c,'Fixa','Contas fixas',x.l)+sec(c,'Variável','Contas variáveis',x.l);
    h+='<div class="ft"><span>Total de gastos</span><span>'+brl(x.t)+'</span></div>';
    h+='<div class="ft"><span>Disponível</span><span class="'+(x.d<0?'bad':'ok')+'">'+brl(x.d)+'</span></div></div>';
  });
  $('cy').innerHTML=h;
  const ms=[];for(let i=0;i<12;i++)ms.push(M-1+i);
  const vals=ms.map(sobra),mx=Math.max(1,...vals.map(Math.abs));
  $('bars').innerHTML=ms.map((m,i)=>{const v=vals[i],ht=Math.max(3,Math.round(Math.abs(v)/mx*70));
    return '<button class="b'+(v<0?' n':'')+(m===M?' cur':'')+'" data-m="'+m+'" title="'+brl(v)+'"><span>'+Math.round(v)+'</span><span class="bw"><i style="height:'+ht+'px"></i></span><span>'+MN[m%12]+'</span></button>'}).join('');
}

let editing=null;
function openDlg(id,c,t){
  const e=id?S.items.find(x=>x.id===id):null;editing=e;
  $('dt').textContent=e?'Editar gasto':'Novo gasto';
  $('fn').value=e?e.name:'';$('fv').value=e?e.v:'';$('ft').value=e?e.t:(t||'Variável');$('fc').value=e?e.c:(c||(V==='30'?'30':'15'));
  const s=e?e.s:M;$('fs').value=Math.floor(s/12)+'-'+String(s%12+1).padStart(2,'0');
  $('fr').checked=e?!e.k:($('ft').value==='Fixa');$('fk').value=e&&e.k?e.k:1;$('fe').value=e?e.e:1;togk();
  $('fd').style.display=e?'':'none';
  $('dlg').showModal();
}
$('add').onclick=()=>openDlg();
function togk(){$('fkl').style.display=$('fr').checked?'none':''}
$('fr').onchange=togk;
$('ft').onchange=()=>{if(!editing){$('fr').checked=$('ft').value==='Fixa';togk()}};
$('fx').onclick=()=>$('dlg').close();
$('fd').onclick=()=>{S.items=S.items.filter(x=>x!==editing);save();$('dlg').close();render()};
$('fsv').onclick=()=>{
  const name=$('fn').value.trim(),v=parseFloat($('fv').value);
  if(!name||isNaN(v)||v<0){$('fn').focus();return}
  const p=($('fs').value||'').split('-');
  const s=p.length===2?ix(+p[0],+p[1]):M;
  const o={name,v,t:$('ft').value,c:$('fc').value,s,k:$('fr').checked?0:Math.max(1,parseInt($('fk').value)||1),e:Math.max(1,parseInt($('fe').value)||1)};
  if(editing)Object.assign(editing,o);else S.items.push(Object.assign({id:'u'+Date.now()},o));
  save();$('dlg').close();render();
};
$('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b){V=b.dataset.v;render()}});
$('pv').onclick=()=>{M--;render()};
$('nx').onclick=()=>{M++;render()};
$('rst').onclick=()=>{if(confirm('Voltar para os dados de exemplo? Suas alterações serão perdidas.')){S=seed();save();render()}};
$('cy').addEventListener('click',e=>{const ad=e.target.closest('[data-add]');if(ad){const p=ad.dataset.add.split('|');openDlg(null,p[0],p[1]);return}const b=e.target.closest('.it');if(b)openDlg(b.dataset.id)});
$('cy').addEventListener('change',e=>{const c=e.target.dataset.inc;if(c){S.inc[c]=parseFloat(e.target.value)||0;save();render()}});
$('bars').addEventListener('click',e=>{const b=e.target.closest('.b');if(b){M=+b.dataset.m;render()}});
$('bx').onclick=()=>{
  const d=new Date(),n='backup-gastos-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
  const bl=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(bl);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
$('bi').onclick=()=>$('bf').click();
$('bf').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.inc||!Array.isArray(o.items))throw 0;
    if(confirm('Substituir os dados atuais pelo backup?')){o.items.forEach(x=>{x.t=x.t==='Variável'?'Variável':'Fixa'});S=o;save();render()}}catch(x){alert('Arquivo de backup inválido.')}};
  r.readAsText(f);e.target.value='';
};
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
